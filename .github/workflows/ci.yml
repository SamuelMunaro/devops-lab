name: DevOps Lab CI

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

jobs:
    docker-build:
        runs-on: ubuntu-latest

        steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Build Docker image
          run: docker build -t devops-lab .
    
        - name: Run Docker container
          run: docker run devops-lab